name: Keepalive Workflow

on:
  schedule:
    - cron: '15 4 1,15 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Prevent Inactivity Workflow Disabling
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Enable all workflows via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf_id in $(gh api repos/${{ github.repository }}/actions/workflows --jq '.workflows[].id'); do
            gh api -X PUT repos/${{ github.repository }}/actions/workflows/$wf_id/enable || true
          done
          echo "Keepalive completed at $(date -u)"
